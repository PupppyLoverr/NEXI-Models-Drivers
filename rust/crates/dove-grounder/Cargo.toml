[package]
name = "dove-grounder"
version = "0.1.0"
edition = "2021"
# This crate is a Rust port of nexi-cua's policy (Apache-2.0). See NOTICE.md
# and LICENSES/nexi-cua-Apache-2.0.txt at the repository root.
license = "Apache-2.0"
description = "Local Grounder: NEXI-CUA-1 plus its deterministic resolver, turning a goal phrase into an element and a verb with no LLM tokens"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
blake2 = "0.10"
unicase = "2"
tract-onnx = { version = "0.23.9", default-features = false }

[dev-dependencies]
# Golden inputs carry Python floats; parse them bit-exactly.
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"
