[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nexi-stt"
version = "0.1.0"
description = "Offline CPU Whisper dictation driver, not a desktop dictation product"
requires-python = ">=3.10"
dependencies = ["faster-whisper==1.2.1"]

[project.scripts]
nexi-stt = "nexi_stt.cli:main"

[tool.setuptools]
packages = ["nexi_stt"]

[tool.setuptools.package-data]
nexi_stt = ["assets.json"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["nexi_stt"]

[[tool.mypy.overrides]]
module = ["faster_whisper.*"]
ignore_missing_imports = true
